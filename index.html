<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Words 每日单词</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="noprint">
    <h1>Daily Words<small>每日单词 · 记忆 + 默写</small></h1>
    <div id="stats"></div>
    <input id="search" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
      placeholder="🔍 搜索单词 Search: English / 中文" aria-label="Search words 搜索单词">
    <div class="step">① 选练习方式 How to practise</div>
    <div class="tabs" role="group" aria-label="Mode 模式">
      <button data-mode="write">✍️ 默写<small>Write</small></button>
      <button data-mode="listen">🎧 听写<small>Listen</small></button>
      <button data-mode="cards">🃏 认词<small>Cards</small></button>
      <button data-mode="print">🖨 打印<small>Print</small></button>
      <button data-mode="stats">📊 总结<small>Summary</small></button>
    </div>
    <p id="mode-help" class="muted"></p>
  </header>
  <main id="app"><p class="muted">Loading… 加载中…</p></main>
  <footer id="footer" class="noprint"></footer>
</div>
<script src="app.js"></script>
</body>
</html>
